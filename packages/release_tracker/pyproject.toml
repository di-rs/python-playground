[project]
name = "release-tracker"
version = "0.1.0"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
]

[tool.fastapi]
entrypoint = "release_tracker.main:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
